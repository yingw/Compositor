name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app-arm64:
    name: Compositor.app (arm64, macOS 15+)
    # Release build for Apple silicon (macOS 15.0+). Deployment target lowered from 26.0 to 15.0.
    # macOS 15 is the practical floor: the code uses macOS 15-only APIs (ScrollPosition, CGPoint Hashable).
    # Xcode 26.6's Swift compiler can crash on this codebase in Release -O (SIL optimizer), so earlier
    # toolchains are tried first; 26.6 -Onone is the guaranteed fallback.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      # Ad-hoc signed: fine for personal use; Gatekeeper wants a right-click Open the first time.
      - name: Build Release (arm64)
        run: |
          for attempt in "Xcode_26.2 -O" "Xcode_26.5 -O" "Xcode_26.4.1 -O" "Xcode_26.6 -Onone"; do
            set -- $attempt
            xcode=$1; level=$2
            echo "::group::Build with $xcode, SWIFT_OPTIMIZATION_LEVEL=$level"
            sudo xcode-select -s "/Applications/$xcode.app"
            if xcodebuild build \
              -project Compositor.xcodeproj \
              -scheme Compositor \
              -destination 'platform=macOS,arch=arm64' \
              -configuration Release \
              -derivedDataPath DerivedData \
              CODE_SIGN_IDENTITY=- \
              CODE_SIGNING_REQUIRED=NO \
              ENABLE_CODE_COVERAGE=NO \
              SWIFT_COMPILATION_MODE=incremental \
              SWIFT_OPTIMIZATION_LEVEL=$level \
              > build.log 2>&1; then
              echo "::endgroup::"
              echo "Built with $xcode, SWIFT_OPTIMIZATION_LEVEL=$level" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::endgroup::"
            echo "Build failed with $xcode $level; last lines:"
            tail -5 build.log
            rm -rf DerivedData build.log
          done
          exit 1

      # Re-sign the whole bundle in one pass so Sparkle (and any other embedded
      # framework) shares the same ad-hoc signature as the main binary. Without this,
      # dyld rejects Sparkle at launch with "different Team IDs".
      - name: Ad-hoc re-sign app bundle
        run: codesign --force --deep --sign - DerivedData/Build/Products/Release/Compositor.app

      - name: Verify signature
        run: codesign --verify --deep --strict DerivedData/Build/Products/Release/Compositor.app

      - name: Zip Compositor.app
        run: >
          cd DerivedData/Build/Products/Release
          && ditto -c -k --keepParent Compositor.app Compositor-arm64.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: Compositor-arm64
          path: DerivedData/Build/Products/Release/Compositor-arm64.zip
          retention-days: 30

  app-x86_64:
    name: Compositor.app (x86_64, macOS 15+)
    # Release build for Intel Macs (macOS 15.0+), cross-compiled on the runner.
    # macos-26 runners are Apple silicon, so x86_64 is built via generic destination + ARCHS override.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      - name: Build Release (x86_64)
        run: |
          for attempt in "Xcode_26.2 -O" "Xcode_26.5 -O" "Xcode_26.4.1 -O" "Xcode_26.6 -Onone"; do
            set -- $attempt
            xcode=$1; level=$2
            echo "::group::Build with $xcode, SWIFT_OPTIMIZATION_LEVEL=$level"
            sudo xcode-select -s "/Applications/$xcode.app"
            if xcodebuild build \
              -project Compositor.xcodeproj \
              -scheme Compositor \
              -destination 'generic/platform=macOS' \
              -configuration Release \
              -derivedDataPath DerivedData \
              ARCHS=x86_64 \
              ONLY_ACTIVE_ARCH=NO \
              CODE_SIGN_IDENTITY=- \
              CODE_SIGNING_REQUIRED=NO \
              ENABLE_CODE_COVERAGE=NO \
              SWIFT_COMPILATION_MODE=incremental \
              SWIFT_OPTIMIZATION_LEVEL=$level \
              > build.log 2>&1; then
              echo "::endgroup::"
              echo "Built with $xcode, SWIFT_OPTIMIZATION_LEVEL=$level" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::endgroup::"
            echo "Build failed with $xcode $level; last lines:"
            tail -5 build.log
            rm -rf DerivedData build.log
          done
          exit 1

      # Re-sign the whole bundle in one pass so Sparkle (and any other embedded
      # framework) shares the same ad-hoc signature as the main binary. Without this,
      # dyld rejects Sparkle at launch with "different Team IDs".
      - name: Ad-hoc re-sign app bundle
        run: codesign --force --deep --sign - DerivedData/Build/Products/Release/Compositor.app

      - name: Verify signature
        run: codesign --verify --deep --strict DerivedData/Build/Products/Release/Compositor.app

      - name: Zip Compositor.app
        run: >
          cd DerivedData/Build/Products/Release
          && ditto -c -k --keepParent Compositor.app Compositor-x86_64.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: Compositor-x86_64
          path: DerivedData/Build/Products/Release/Compositor-x86_64.zip
          retention-days: 30
